
name: VWW Journey - Jcink Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-jcink:
    runs-on: ubuntu-latest

    steps:
      - name: Test public Jcink thread access
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error

          url = "https://vwwnewleaf.jcink.net/index.php?showtopic=68"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "VWW-Newleaf-Journey/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  html = response.read().decode("utf-8", "replace")
                  status = response.status

              print("HTTP status:", status)
              print("Response length:", len(html))
              print("Jaggedstar found:", "Jaggedstar" in html)
              print("Steaming Pools found:", "The Steaming Pools" in html)
              print("Post 276 found:", "p=276" in html)
              print("Security challenge:", "Please stand by" in html)

          except urllib.error.HTTPError as error:
              print("HTTP error:", error.code)
          except Exception as error:
              print("Connection error:", type(error).__name__, str(error))
          PY
