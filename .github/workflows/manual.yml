
name: VWW Journey - RP Scanner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan Jaggedstar's RP thread
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser

          URL = "https://vwwnewleaf.jcink.net/index.php?showtopic=68"

          class Scanner(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.posts = []
                  self.current = None
                  self.in_header = False
                  self.in_controls = False
                  self.in_nav = False
                  self.forums = []
                  self.capture_forum = None

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  classes = a.get("class", "").split()

                  if "postWrapper" in classes:
                      self.current = {
                          "character": "",
                          "characterId": "",
                          "postId": ""
                      }

                  if self.current is not None:
                      if "postHeader" in classes:
                          self.in_header = True
                      if "postControls" in classes:
                          self.in_controls = True

                      href = a.get("href", "")

                      if self.in_header and "showuser=" in href:
                          match = re.search(r"showuser=(\d+)", href)
                          if match:
                              self.current["characterId"] = match.group(1)

                      if self.in_controls and "view=findpost" in href:
                          match = re.search(r"[?&]p=(\d+)", href)
                          if match:
                              self.current["postId"] = match.group(1)

                  if "navigationTree" in classes:
                      self.in_nav = True

                  if self.in_nav and tag == "a":
                      href = a.get("href", "")
                      match = re.search(r"showforum=(\d+)", href)
                      if match:
                          self.capture_forum = {
                              "id": match.group(1),
                              "name": ""
                          }

              def handle_data(self, data):
                  if self.capture_forum:
                      self.capture_forum["name"] += data

              def handle_endtag(self, tag):
                  if tag == "a" and self.capture_forum:
                      self.forums.append(self.capture_forum)
                      self.capture_forum = None

          request = urllib.request.Request(
              URL,
              headers={"User-Agent": "VWW-Newleaf-Journey/1.0"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              html = response.read().decode("utf-8", "replace")

          if "Please stand by" in html:
              raise RuntimeError("Jcink security challenge encountered")

          scanner = Scanner()
          scanner.feed(html)

          print("Downloaded HTML:", len(html), "characters")
          print("Forums detected:", scanner.forums)
          print("Posts detected:", scanner.posts)
          PY
